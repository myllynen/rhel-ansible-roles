---
- name: Set changed packages
  ansible.builtin.set_fact:
    __rar_pr_removed_packages_all: "{{ (__rar_pr_removed_packages.results | default([])
                               + __rar_pr_removed_packages_leaf.results | default([]))
                              | reject('search', 'No match') | sort }}"

- name: Display package changes
  ansible.builtin.debug:
    msg: "{{ __rar_pr_removed_packages_all | join('\n') }}"
  when: __rar_pr_removed_packages_all | length > 0
