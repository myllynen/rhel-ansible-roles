---
- name: Remove unwanted packages
  vars:
    __rar_pr_remove_packages: "{{ packages_remove | select
                         | difference((packages_install | default([])) | select)
                         | difference(packages_remove_exclude | select) }}"
  ansible.builtin.dnf:
    name: "{{ __rar_pr_remove_packages }}"
    state: absent
    exclude: "{{ packages_remove_exclude | select }}"
    autoremove: false
    cacheonly: true
    disablerepo: '*'
  register: __rar_pr_removed_packages
  when: __rar_pr_remove_packages | length > 0

- name: Remove unneeded leaf packages
  ansible.builtin.dnf:
    state: absent
    exclude: "{{ packages_remove_exclude | select }}"
    autoremove: true
    cacheonly: true
    disablerepo: '*'
  register: __rar_pr_removed_packages_leaf
  when: packages_remove_autoremove | bool

- name: Display package changes
  ansible.builtin.include_tasks: display.yml
  when:
    - packages_remove_display_results | bool
    - __rar_pr_removed_packages is changed or
      __rar_pr_removed_packages_leaf is changed
