---
argument_specs:
  main:
    short_description: Configure package repositories and Red Hat Subscription Management
    description: Copy and remove yum repository files, register or unregister the system, and enable and disable RHSM repositories.
    options:
      repository_setup_repo_files_copy:
        description: List of files to copy to /etc/yum.repos.d.
        type: list
        elements: str
      repository_setup_repo_files_remove:
        description: List of files to remove in /etc/yum.repos.d.
        type: list
        elements: str
      repository_setup_rhsm_configure:
        description: Do Red Hat Subscription Management configuration, if false then rest of the parameters are ignored.
        type: bool
      repository_setup_rhsm_subscribe:
        description: Subscribe or unsubscribe to Red Hat or Satellite.
        type: bool
      repository_setup_rhsm_curl_args:
        description: Curl arguments as a double-quoted string to register with, if set the other RHSM parameters are ignored.
        type: str
      repository_setup_install_katello_rpm:
        description: Install Satellite katello-ca-consumer-latest.rpm, this will use the rhsm_baseurl parameter.
        type: bool
      repository_setup_rhsm_facts_update_always:
        description: Force updating system facts at RHSM even if no changes made for subscription or repositories.
        type: bool
      repository_setup_package_profile_on_trans:
        description: Configure subscription-manager to update package profile at RHSM after every dnf/yum transaction.
        type: bool
      repository_setup_rhsm_parameters:
        description: Red Hat Subscription Management parameters, leave activationkey and username undefined to skip RHSM configuration.
        type: dict
        options:
          activationkey:
            description: Activation key to use for registration.
            type: str
          org_id:
            description: Organization identifier to use for registration.
            type: str
          username:
            description: Username to use for registration.
            type: str
          password:
            description: Password to use for registration, should come from vault.
            type: str
          auto_attach:
            description: Upon successful registration, auto-consume available subscriptions.
            type: bool
          consumer_id:
            description: Consumer identifier of an existing registration to reuse.
            type: str
          consumer_name:
            description: Name of the consumer to register as, defaults to the hostname.
            type: str
          consumer_type:
            description: Type of the consumer to register as.
            type: str
          environment:
            description: Environment to register to, Satellite and Katello only.
            type: str
          force_register:
            description: Register the system even if it is already registered.
            type: bool
          pool_ids:
            description: List of pool identifiers to attach to.
            type: list
            elements: raw
          release:
            description: Release version to set after registration.
            type: str
          rhsm_baseurl:
            description: Base URL for content, also used for the katello-ca-consumer RPM.
            type: str
          rhsm_repo_ca_cert:
            description: CA certificate to use for the content repositories.
            type: str
          server_hostname:
            description: Hostname of the subscription server.
            type: str
          server_port:
            description: Port of the subscription server.
            type: str
          server_insecure:
            description: Allow an insecure connection to the subscription server.
            type: bool
          server_prefix:
            description: Path prefix of the subscription server.
            type: str
          server_proxy_hostname:
            description: Hostname of the proxy server.
            type: str
          server_proxy_port:
            description: Port of the proxy server.
            type: str
          server_proxy_user:
            description: Username for the proxy server.
            type: str
          server_proxy_password:
            description: Password for the proxy server, should come from vault.
            type: str
          server_proxy_scheme:
            description: Scheme of the proxy server.
            type: str
          syspurpose:
            description: System purpose attributes to set.
            type: dict
            options:
              usage:
                description: Usage of the system.
                type: str
              role:
                description: Role of the system.
                type: str
              service_level_agreement:
                description: Service level agreement of the system.
                type: str
              addons:
                description: List of add-ons of the system.
                type: list
                elements: str
              sync:
                description: Synchronize the system purpose attributes with the server.
                type: bool
          token:
            description: Registration token to use instead of username and password.
            type: str
      repository_setup_rhsm_repositories_disable:
        description: List of Red Hat / Satellite repository IDs to disable.
        type: list
        elements: str
      repository_setup_rhsm_repositories_enable:
        description: List of Red Hat / Satellite repository IDs to enable.
        type: list
        elements: str
      repository_setup_rhsm_repositories_purge:
        description: Disable non-enabled Red Hat / Satellite repositories.
        type: bool
