---
- name: Unregister from Red Hat Subscription Management
  ansible.builtin.command: subscription-manager unregister
  register: __rar_rs_unregister
  failed_when: __rar_rs_unregister.rc != 0 and 'currently not registered' not in __rar_rs_unregister.stderr
  changed_when: __rar_rs_unregister.rc == 0 and 'has been unregistered' in __rar_rs_unregister.stdout
  ignore_errors: true

- name: Remove all Subscription Management local data
  ansible.builtin.command: subscription-manager clean
  changed_when: __rar_rs_unregister is failed

- name: Remove Katello CA package
  ansible.builtin.dnf:
    name: katello-ca-consumer-*
    state: absent
    cacheonly: true
    disable_plugin:
      - product-id
      - subscription-manager
    disablerepo: '*'

- name: Remove Katello CA certificates
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/rhsm/ca/katello-default-ca.pem
    - /etc/rhsm/ca/katello-server-ca.pem

- name: Locate RHSM cache files
  ansible.builtin.find:
    paths: /var/lib/rhsm
    file_type: file
    recurse: true
    excludes:
      - redhat.repo
      - syspurpose.json
  register: __rar_rs_rhsm_cache

- name: Remove RHSM cache files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ __rar_rs_rhsm_cache.files | map(attribute='path') }}"

- name: Clean package manager caches
  ansible.builtin.command: dnf -C --disableplugin=product-id,subscription-manager clean all
  register: __rar_rs_pkg_cache
  changed_when: not __rar_rs_pkg_cache.stdout.startswith('0 files removed')

- name: Check RHSM configuration backup files
  ansible.builtin.find:
    paths: /etc/rhsm
    patterns: 'rhsm.conf.*'
  register: __rar_rs_rhsm_backups

- name: Restore RHSM configuration backup files
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: /etc/rhsm/rhsm.conf
    mode: '0644'
    remote_src: true
  loop: "{{ __rar_rs_rhsm_backups.files | sort(attribute='path') }}"
  loop_control:
    label: "{{ item.path }}"
  when: item.path | basename in ['rhsm.conf.bak', 'rhsm.conf.kat-backup', 'rhsm.conf.rpmnew']

- name: Remove RHSM configuration backup files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ __rar_rs_rhsm_backups.files | sort(attribute='path') }}"
  loop_control:
    label: "{{ item.path }}"
  when: item.path | basename in ['rhsm.conf.bak', 'rhsm.conf.kat-backup', 'rhsm.conf.rpmnew']
