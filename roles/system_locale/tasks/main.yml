---
- name: Gather needed facts
  ansible.builtin.setup:
    gather_subset:
      - '!all'
      - '!min'
      - distribution_major_version
  when: ansible_facts.distribution_major_version is not defined

- name: Fail if unsupported system locale specified
  ansible.builtin.fail:
    msg: "Only C.UTF-8, en_US.UTF-8, or auto are supported as system_locale setting."
  when: system_locale not in ['C.UTF-8', 'en_US.UTF-8', 'auto']

- name: Check C.UTF-8 support
  ansible.builtin.set_fact:
    __rar_lo_c_utf_8: "{{ true if ansible_facts.distribution_major_version | int >= 9 else false }}"

- name: Install locale packages
  vars:
    __rar_lo_locale_packages:
      - glibc-minimal-langpack
      - "{{ 'glibc-langpack-en' if not __rar_lo_c_utf_8 or system_locale == 'en_US.UTF-8' else '' }}"
  ansible.builtin.dnf:
    name: "{{ __rar_lo_locale_packages | select }}"
    state: present

- name: Update system locale configuration
  vars:
    __rar_lo_lang: "{{ 'C.UTF-8' if (system_locale == 'auto' and __rar_lo_c_utf_8) or system_locale == 'C.UTF-8' else 'en_US.UTF-8' }}"
  ansible.builtin.replace:
    path: /etc/locale.conf
    regexp: '^LANG=.*'
    replace: 'LANG="{{ __rar_lo_lang }}"'
  register: __rar_lo_locale_config

- name: Rebuild initramfs
  ansible.builtin.command: dracut -f --regenerate-all
  changed_when: true
  when: __rar_lo_locale_config is changed

- name: Reboot system
  ansible.builtin.reboot:
  when:
    - system_locale_reboot | bool
    - __rar_lo_locale_config is changed
