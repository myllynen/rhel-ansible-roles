---
- name: Install required packages
  ansible.builtin.dnf:
    name:
      - kbd
      - kbd-misc
    state: present
  register: __rar_kb_package_install

- name: Check system keyboard configuration
  check_mode: true
  ansible.builtin.lineinfile:
    path: /etc/vconsole.conf
    regexp: '^KEYMAP=("|){{ system_keyboard }}(|")'
    state: absent
  register: __rar_kb_keyboard_check
  changed_when: false

- name: Configure system keyboard
  ansible.builtin.command: localectl set-keymap {{ system_keyboard }}
  register: __rar_kb_keyboard_config
  changed_when: true
  when: not __rar_kb_keyboard_check.found

- name: Check system console font configuration
  check_mode: true
  ansible.builtin.lineinfile:
    path: /etc/vconsole.conf
    regexp: '^FONT=("|){{ system_font }}(|")'
    state: absent
  register: __rar_kb_font_check
  changed_when: false

- name: Update system console font configuration
  ansible.builtin.replace:
    path: /etc/vconsole.conf
    regexp: '^FONT=("|).*(|")'
    replace: 'FONT={{ system_font }}'
  register: __rar_kb_font_config
  when: not __rar_kb_font_check.found

- name: Configure system console font
  ansible.builtin.command: setfont {{ system_font }}
  changed_when: true
  when: __rar_kb_font_config is changed

- name: Rebuild initramfs
  ansible.builtin.command: dracut -f --regenerate-all
  changed_when: true
  when: __rar_kb_package_install is changed or
        __rar_kb_keyboard_config is changed or
        __rar_kb_font_config is changed
