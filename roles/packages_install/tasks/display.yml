---
- name: Set changed packages
  ansible.builtin.set_fact:
    __rar_pi_installed_packages_all: "{{ __rar_pi_installed_packages.results | default([]) | sort }}"

- name: Display package changes
  ansible.builtin.debug:
    msg: "{{ __rar_pi_installed_packages_all | join('\n') }}"
  when: __rar_pi_installed_packages_all | length > 0
