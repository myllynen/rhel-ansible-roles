---
- name: Install required packages
  vars:
    __rar_fu_base_pkgs: "{{ ['gzip', 'tar', 'xz'] }}"
    __rar_fu_attrs_used: "{{ true if files_unarchive | selectattr('attributes', 'defined') | length > 0 else false }}"
    __rar_fu_attr_pkgs: "{{ ['e2fsprogs'] if __rar_fu_attrs_used else [] }}"
    __rar_fu_bzip2_used: "{{ true if files_unarchive | selectattr('src', 'search', '\\.bz2$') | length > 0 else false }}"
    __rar_fu_bzip2_pkgs: "{{ ['bzip2'] if __rar_fu_bzip2_used else [] }}"
    __rar_fu_zip_used: "{{ true if files_unarchive | selectattr('src', 'search', '\\.zip$') | length > 0 else false }}"
    __rar_fu_zip_pkgs: "{{ ['zip', 'unzip'] if __rar_fu_zip_used else [] }}"
    __rar_fu_zstd_used: "{{ true if files_unarchive | selectattr('src', 'search', '\\.zst$') | length > 0 else false }}"
    __rar_fu_zstd_pkgs: "{{ ['zstd'] if __rar_fu_zstd_used else [] }}"
    __rar_fu_required_pkgs: "{{ __rar_fu_base_pkgs + __rar_fu_attr_pkgs + __rar_fu_bzip2_pkgs + __rar_fu_zip_pkgs + __rar_fu_zstd_pkgs }}"
  ansible.builtin.dnf:
    name: "{{ __rar_fu_required_pkgs }}"
    state: present
  when: files_unarchive | select | length > 0

- name: Unarchive files
  ansible.builtin.unarchive:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    creates: "{{ item.creates | default(omit) }}"
    remote_src: "{{ item.remote_src | default(omit) }}"
    validate_certs: "{{ item.validate_certs | default(omit) }}"
    owner: "{{ item.owner | default(omit) }}"
    group: "{{ item.group | default(omit) }}"
    mode: "{{ item.mode | default(omit) }}"
    attributes: "{{ item.attributes | default(omit) }}"
    decrypt: "{{ item.decrypt | default(omit) }}"
    exclude: "{{ item.exclude | default(omit) }}"
    include: "{{ item.include | default(omit) }}"
    keep_newer: "{{ item.keep_newer | default(omit) }}"
    list_files: "{{ item.list_files | default(omit) }}"
    extra_opts: "{{ item.extra_opts | default(omit) }}"
    selevel: "{{ item.selevel | default(omit) }}"
    serole: "{{ item.serole | default(omit) }}"
    setype: "{{ item.setype | default(omit) }}"
    seuser: "{{ item.seuser | default(omit) }}"
    unsafe_writes: "{{ item.unsafe_writes | default(omit) }}"
    io_buffer_size: "{{ item.io_buffer_size | default(omit) }}"
  register: unarchive_files
  loop: "{{ files_unarchive | select }}"
  loop_control:
    label: "{{ item.src + ' -> ' + item.dest }}"
