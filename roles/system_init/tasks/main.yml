---
# For backward compatibility, to be removed after RHEL 9 EOL
- name: Migrate old system init file if present
  ansible.builtin.command: mv /etc/.local_system_info {{ __rar_si_system_init_file }}
  register: __rar_si_mv_status
  failed_when: false
  changed_when: __rar_si_mv_status.rc == 0

- name: Check system status
  ansible.builtin.stat:
    path: "{{ __rar_si_system_init_file }}"
  register: __rar_si_system_init

- name: Initialize fresh system
  ansible.builtin.include_tasks: init.yml
  when: not __rar_si_system_init.stat.exists
