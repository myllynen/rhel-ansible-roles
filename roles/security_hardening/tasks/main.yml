---
- name: Gather needed facts
  ansible.builtin.setup:
    gather_subset:
      - '!all'
      - '!min'
      - cmdline
      - distribution_major_version
  when: ansible_facts.cmdline is not defined or
        ansible_facts.distribution_major_version is not defined

- name: Install required packages
  vars:
    __rar_sh_security_packages:
      - crypto-policies-scripts
      - grubby
      - "{{ 'mokutil' if secure_boot_verify | bool else '' }}"
    __rar_sh_selinux_packages:
      - python3-libselinux
      - python3-libsemanage
      - policycoreutils-python-utils
      - selinux-policy-targeted
      - setools-console
  ansible.builtin.dnf:
    name: "{{ __rar_sh_security_packages | select | list + __rar_sh_selinux_packages }}"
    state: present

- name: Gather package facts
  ansible.builtin.package_facts:

- name: Check Secure Boot state
  check_mode: false
  ansible.builtin.command: mokutil --sb-state
  register: __rar_sh_sb_state
  failed_when: false
  changed_when: false
  when:
    - "'mokutil' in ansible_facts.packages"
    - secure_boot_verify | bool

- name: Fail if Secure Boot not enabled
  ansible.builtin.fail:
    msg: "Secure Boot not enabled."
  when:
    - "'mokutil' in ansible_facts.packages"
    - secure_boot_verify | bool
    - __rar_sh_sb_state.stdout | regex_search("Secure?Boot enabled") is none

- name: Verify FIPS mode (CPU)
  check_mode: false
  ansible.builtin.command: grep -w aes /proc/cpuinfo
  register: __rar_sh_cpu_flags
  failed_when: "'aes' not in __rar_sh_cpu_flags.stdout"
  changed_when: false
  when: fips_mode_verify | bool

- name: Verify FIPS mode (system)
  check_mode: false
  ansible.builtin.command: cat /proc/sys/crypto/fips_enabled
  register: __rar_sh_fips_mode
  failed_when: __rar_sh_fips_mode.stdout != '1'
  changed_when: false
  when: fips_mode_verify | bool

- name: Verify FIPS mode (crypto policies)
  check_mode: false
  ansible.builtin.command: update-crypto-policies --show
  register: __rar_sh_crypto_policies
  failed_when: "'FIPS' not in __rar_sh_crypto_policies.stdout"
  changed_when: false
  when: fips_mode_verify | bool

- name: Check kernel lockdown configuration
  vars:
    __rar_sh_lockdown_param: "{{ 'lockdown=' + kernel_lockdown if kernel_lockdown != 'disabled' else 'lockdown' }}"
  check_mode: true
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX=.*("| ){{ __rar_sh_lockdown_param }}(=| |")'
    state: absent
  register: __rar_sh_lockdown_check
  changed_when: false
  when: ansible_facts.distribution_major_version | int >= 9

- name: Configure kernel lockdown
  ansible.builtin.command: >
    grubby
    --update-kernel=ALL
    --remove-args=lockdown
    "{{ '--args=lockdown=' + kernel_lockdown if kernel_lockdown != 'disabled' else '' }}"
  register: __rar_sh_lockdown_config
  changed_when: true
  when:
    - "'grubby' in ansible_facts.packages"
    - ansible_facts.distribution_major_version | int >= 9
    - (kernel_lockdown == 'disabled' and __rar_sh_lockdown_check.found != 0) or
      (kernel_lockdown != 'disabled' and __rar_sh_lockdown_check.found == 0)

- name: Configure SELinux state
  vars:
    __rar_sh_update_cmdline: "{{ true if 'selinux' in ansible_facts.cmdline or selinux == 'disabled' else false }}"
  ansible.posix.selinux:
    policy: targeted
    state: "{{ selinux }}"
    update_kernel_param: "{{ __rar_sh_update_cmdline }}"
  register: __rar_sh_selinux_config
  when:
    - "'grubby' in ansible_facts.packages"
    - "'python3-libselinux' in ansible_facts.packages"

- name: Check current crypto policy
  check_mode: false
  ansible.builtin.command: update-crypto-policies --show
  register: __rar_sh_current_crypto_policy
  changed_when: false
  when: "'crypto-policies-scripts' in ansible_facts.packages"

- name: Configure crypto policy
  ansible.builtin.command: update-crypto-policies --no-reload --set {{ crypto_policy }}
  register: __rar_sh_crypto_policy_config
  changed_when: true
  when:
    - "'crypto-policies-scripts' in ansible_facts.packages"
    - __rar_sh_current_crypto_policy.stdout != crypto_policy

- name: Check SCP protocol configuration
  ansible.builtin.stat:
    path: /etc/ssh/disable_scp
  register: __rar_sh_scp_state

- name: Configure SCP protocol state
  ansible.builtin.file:
    state: "{{ 'absent' if scp_protocol_enable | bool else 'touch' }}"
    path: /etc/ssh/disable_scp
    mode: '0644'
  when: __rar_sh_scp_state.stat.exists == scp_protocol_enable | bool

- name: Reboot system
  ansible.builtin.reboot:
  when: __rar_sh_lockdown_config is changed or
        (__rar_sh_selinux_config.reboot_required is defined and __rar_sh_selinux_config.reboot_required) or
        __rar_sh_crypto_policy_config is changed
