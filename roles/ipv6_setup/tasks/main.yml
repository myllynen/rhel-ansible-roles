---
- name: Gather package facts
  ansible.builtin.package_facts:

# This role may run before repositories are setup
- name: Install grubby package
  ansible.builtin.dnf:
    name: grubby
    state: present
  when: "'grubby' not in ansible_facts.packages"

- name: Check IPv6 boot parameter
  check_mode: true
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX=.*("| )ipv6.disable(=| |")'
    state: absent
  register: __rar_ip_boot_param_check
  changed_when: false

- name: Remove IPv6 boot parameter
  ansible.builtin.command: >
    grubby
    --update-kernel=ALL
    --remove-args="ipv6.disable"
  register: __rar_ip_boot_config
  changed_when: true
  when: __rar_ip_boot_param_check.found == 1

- name: Update IPv6 sysctl parameters configuration
  vars:
    __rar_ip_disable_ipv6: "{{ '0' if ipv6_setup_enable | bool else '1' }}"
    __rar_ip_loopback_disable_ipv6: >
      {{ '1' if not ipv6_setup_enable | bool and not ipv6_setup_loopback_persist | bool else '0' }}
  ansible.builtin.copy:
    content: |
      net.ipv6.conf.all.disable_ipv6 = {{ __rar_ip_disable_ipv6 }}
      net.ipv6.conf.default.disable_ipv6 = {{ __rar_ip_disable_ipv6 }}
      net.ipv6.conf.lo.disable_ipv6 = {{ __rar_ip_loopback_disable_ipv6 }}
    dest: /etc/sysctl.d/50-ipv6.conf
    mode: '0644'
  register: __rar_ip_sysctl_config

- name: Locate NIC ifcfg configuration files
  ansible.builtin.find:
    paths: /etc/sysconfig/network-scripts
    patterns:
      - 'ifcfg-e*'
      - 'ifcfg-net*'
  register: __rar_ip_ifcfg_files
  when: ipv6_setup_configure_nm | bool

- name: Locate NM connection configuration files
  ansible.builtin.find:
    paths: /etc/NetworkManager/system-connections
    patterns:
      - '*.nmconnection'
  register: __rar_ip_nmconnection_files
  when: ipv6_setup_configure_nm | bool

- name: Update IPv6 configuration in NIC ifcfg files
  vars:
    __rar_ip_disable_ipv6: "{{ 'yes' if ipv6_setup_enable | bool else 'no' }}"
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: '^IPV6INIT=.*'
    replace: 'IPV6INIT={{ __rar_ip_disable_ipv6 }}'
  register: __rar_ip_ifcfg_config
  loop: "{{ __rar_ip_ifcfg_files.files | map(attribute='path') }}"
  when: ipv6_setup_configure_nm | bool

- name: Update IPv6 configuration in NM connection files
  vars:
    __rar_ip_disable_ipv6: "{{ 'auto' if ipv6_setup_enable | bool else 'disabled' }}"
  ansible.builtin.replace:
    path: "{{ item }}"
    after: '\[ipv6\]'
    before: '\[proxy\]'
    regexp: '^method=.*'
    replace: 'method={{ __rar_ip_disable_ipv6 }}'
  register: __rar_ip_nmconnection_config
  loop: "{{ __rar_ip_nmconnection_files.files | map(attribute='path') }}"
  when: ipv6_setup_configure_nm | bool

- name: Rebuild initramfs
  ansible.builtin.command: dracut -f --regenerate-all
  changed_when: true
  when: __rar_ip_sysctl_config is changed

- name: Reboot system
  ansible.builtin.reboot:
  when: __rar_ip_boot_config is changed or
        __rar_ip_sysctl_config is changed or
        __rar_ip_ifcfg_config is changed or
        __rar_ip_nmconnection_config is changed
