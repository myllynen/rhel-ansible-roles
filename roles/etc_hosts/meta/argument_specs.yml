---
argument_specs:
  main:
    short_description: Manage the /etc/hosts file
    description: Create /etc/hosts from a header, an optional entry for the host itself, and a list of static entries.
    options:
      etc_hosts_header:
        description: /etc/hosts header to always apply, subject to etc_hosts_omit_entries.
        type: str
      etc_hosts_self_add:
        description: Add entry for host itself based on Ansible facts, should be disabled when not using static IP.
        type: bool
      etc_hosts_self_domain:
        description: Force domain name used in host self entry, if unset defaults to ansible_facts.domain, required if ansible_facts.domain is empty.
        type: str
      etc_hosts_entries:
        description: List of lines to add to /etc/hosts, other entries will be removed.
        type: list
        elements: str
      etc_hosts_omit_entries:
        description: /etc/hosts entries to omit, none to not omit entries, ipv4 or ipv6 to omit all entries of that family.
        type: str
        choices: [none, ipv4, ipv6]
