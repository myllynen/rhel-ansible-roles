---
- name: Disable system runtime watchdog configuration
  vars:
    __rar_wd_option_value: "{{ 'off' if ansible_facts.distribution_major_version | int >= 9 else '0' }}"
  ansible.builtin.lineinfile:
    path: "{{ __rar_wd_watchdog_conf }}"
    regexp: '^(#|)RuntimeWatchdogSec=.*'
    line: '#RuntimeWatchdogSec={{ __rar_wd_option_value }}'
  register: __rar_wd_watchdog_runtime
  when: __rar_wd_watchdog_check.stat.exists

- name: Restore system reboot watchdog default configuration
  vars:
    __rar_wd_option_name: "{{ 'RebootWatchdogSec' if ansible_facts.distribution_major_version | int >= 9 else 'ShutdownWatchdogSec' }}"
  ansible.builtin.lineinfile:
    path: "{{ __rar_wd_watchdog_conf }}"
    regexp: '^(#|){{ __rar_wd_option_name }}=.*'
    line: '#{{ __rar_wd_option_name }}=10min'
  register: __rar_wd_watchdog_reboot
  when: __rar_wd_watchdog_check.stat.exists

- name: Disable system kexec watchdog configuration
  vars:
    __rar_wd_option_state: "{{ 'present' if ansible_facts.distribution_major_version | int >= 9 else 'absent' }}"
  ansible.builtin.lineinfile:
    state: "{{ __rar_wd_option_state }}"
    path: "{{ __rar_wd_watchdog_conf }}"
    regexp: '^(#|)KExecWatchdogSec=.*'
    line: '#KExecWatchdogSec=off'
  register: __rar_wd_watchdog_kexec
  when: __rar_wd_watchdog_check.stat.exists

- name: Restore system watchdog device default configuration
  vars:
    __rar_wd_option_state: "{{ 'present' if ansible_facts.distribution_major_version | int >= 9 else 'absent' }}"
  ansible.builtin.lineinfile:
    state: "{{ __rar_wd_option_state }}"
    path: "{{ __rar_wd_watchdog_conf }}"
    regexp: '^(#|)WatchdogDevice=.*'
    line: '#WatchdogDevice='
  register: __rar_wd_watchdog_device_reg
  when: __rar_wd_watchdog_check.stat.exists

- name: Reload systemd to apply configuration changes
  ansible.builtin.systemd:
    daemon_reload: true
  when: __rar_wd_watchdog_runtime is changed or
        __rar_wd_watchdog_reboot is changed or
        __rar_wd_watchdog_kexec is changed or
        __rar_wd_watchdog_device_reg is changed

- name: Rebuild initramfs
  ansible.builtin.command: dracut -f --regenerate-all
  changed_when: true
  when: __rar_wd_watchdog_runtime is changed or
        __rar_wd_watchdog_reboot is changed or
        __rar_wd_watchdog_kexec is changed or
        __rar_wd_watchdog_device_reg is changed
